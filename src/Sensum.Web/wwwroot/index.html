<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensum Bot Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
        }
        
        .status-dot.connected {
            background: #2ed573;
            box-shadow: 0 0 10px #2ed573;
        }
        
        .add-bot-form {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .form-row input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }
        
        .form-row input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,217,255,0.4);
        }
        
        .btn-danger {
            background: #ff4757;
            color: #fff;
        }
        
        .btn-success {
            background: #2ed573;
            color: #fff;
        }
        
        .btn-warning {
            background: #ffa502;
            color: #fff;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .bots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .bot-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .bot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .bot-name {
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status-connected {
            background: rgba(46,213,115,0.2);
            color: #2ed573;
        }
        
        .status-disconnected {
            background: rgba(255,71,87,0.2);
            color: #ff4757;
        }
        
        .bot-info {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .bot-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .bot-actions .btn {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
        }
        
        .console-output {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        
        .console-line {
            margin-bottom: 5px;
            word-break: break-word;
        }
        
        .no-bots {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.5);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        .toast.success {
            background: #2ed573;
        }
        
        .toast.error {
            background: #ff4757;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }
        
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .bots-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Sensum Bot Manager</h1>
            <p>Manage and monitor your Growtopia bots from a single interface</p>
        </header>
        
        <div id="auth-section" style="display: none;" class="status-bar">
            <span id="user-info"></span>
            <button class="btn btn-warning" onclick="logout()" style="margin-left: 10px;">Logout</button>
        </div>
        
        <div class="status-bar">
            <div class="connection-status">
                <div class="status-dot" id="connection-dot"></div>
                <span id="connection-text">Connecting...</span>
            </div>
            <div id="server-status">Server: Checking...</div>
        </div>
        
        <div id="google-login-section" class="add-bot-form" style="text-align: center;">
            <h2 style="margin-bottom: 15px;">Sign In to Continue</h2>
            <p style="margin-bottom: 20px; color: rgba(255,255,255,0.7);">Sign in with your Google account to manage bots</p>
            <a href="/api/auth/google" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </a>
        </div>
        
        <div id="main-content" style="display: none;">
            <div class="add-bot-form">
                <h2 style="margin-bottom: 15px;">Add New Bot</h2>
                <div class="form-row">
                    <input type="text" id="growid" placeholder="GrowID" autocomplete="off">
                    <input type="password" id="password" placeholder="Password" autocomplete="off">
                    <button class="btn btn-primary" onclick="addBot()" id="add-btn">Add Bot</button>
                </div>
            </div>
            
            <div id="bots-container" class="bots-grid">
                <div class="loading">Loading bots...</div>
            </div>
        </div>
    </div>

    <script>
        let bots = [];
        let connection = null;
        let isRealtimeConnected = false;
        
        // Initialize SignalR connection
        async function initSignalR() {
            try {
                connection = new signalR.HubConnectionBuilder()
                    .withUrl('/hubs/bots')
                    .withAutomaticReconnect([0, 2000, 5000, 10000, 30000])
                    .build();
                
                connection.on('BotUpdated', (botId) => {
                    fetchBots();
                });
                
                connection.onreconnecting(() => {
                    updateConnectionStatus(false, 'Reconnecting...');
                });
                
                connection.onreconnected(() => {
                    updateConnectionStatus(true, 'Real-time updates active');
                    fetchBots();
                });
                
                connection.onclose(() => {
                    updateConnectionStatus(false, 'Disconnected - Polling mode');
                });
                
                await connection.start();
                updateConnectionStatus(true, 'Real-time updates active');
                console.log('SignalR connected');
            } catch (err) {
                console.error('SignalR connection failed:', err);
                updateConnectionStatus(false, 'Polling mode');
            }
        }
        
        function updateConnectionStatus(connected, text) {
            isRealtimeConnected = connected;
            const dot = document.getElementById('connection-dot');
            const txt = document.getElementById('connection-text');
            
            if (connected) {
                dot.classList.add('connected');
            } else {
                dot.classList.remove('connected');
            }
            txt.textContent = text;
        }
        
        async function checkServerHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                document.getElementById('server-status').textContent = `Server: ${data.status} (${data.botCount} bots)`;
            } catch (error) {
                document.getElementById('server-status').textContent = 'Server: Offline';
            }
        }
        
        async function fetchBots() {
            try {
                const response = await fetch('/api/bots');
                const result = await response.json();
                bots = result.data || [];
                renderBots();
            } catch (error) {
                console.error('Error fetching bots:', error);
                showToast('Failed to fetch bots', 'error');
            }
        }
        
        function renderBots() {
            const container = document.getElementById('bots-container');
            
            if (bots.length === 0) {
                container.innerHTML = '<div class="no-bots"><h2>No bots yet</h2><p>Add your first bot using the form above</p></div>';
                return;
            }
            
            container.innerHTML = bots.map(bot => `
                <div class="bot-card">
                    <div class="bot-header">
                        <span class="bot-name">${escapeHtml(bot.name)}</span>
                        <span class="status-badge ${bot.isConnected ? 'status-connected' : 'status-disconnected'}">
                            ${bot.isConnected ? '● Connected' : '○ Disconnected'}
                        </span>
                    </div>
                    <div class="bot-info">
                        <div>World: ${bot.worldName || 'N/A'}</div>
                        <div>Ping: ${bot.ping || 0}ms</div>
                        <div>ID: ${bot.id}</div>
                        <div>Created: ${new Date(bot.createdAt).toLocaleString()}</div>
                    </div>
                    <div class="bot-actions">
                        ${!bot.isConnected 
                            ? `<button class="btn btn-success" onclick="connectBot('${bot.id}')">Connect</button>`
                            : `<button class="btn btn-warning" onclick="disconnectBot('${bot.id}')">Disconnect</button>`
                        }
                        <button class="btn btn-danger" onclick="removeBot('${bot.id}')">Remove</button>
                    </div>
                    <div class="console-output" id="console-${bot.id}">
                        ${bot.consoleMessages.map(msg => `<div class="console-line">${escapeHtml(msg)}</div>`).join('')}
                    </div>
                </div>
            `).join('');
            
            // Scroll console to bottom
            bots.forEach(bot => {
                const consoleEl = document.getElementById(`console-${bot.id}`);
                if (consoleEl) {
                    consoleEl.scrollTop = consoleEl.scrollHeight;
                }
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        async function addBot() {
            const growidInput = document.getElementById('growid');
            const passwordInput = document.getElementById('password');
            const addBtn = document.getElementById('add-btn');
            
            const growid = growidInput.value.trim();
            const password = passwordInput.value;
            
            if (!growid || !password) {
                showToast('Please enter both GrowID and Password', 'error');
                return;
            }
            
            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';
            
            try {
                const response = await fetch('/api/bots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ growid, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('Bot added successfully', 'success');
                    growidInput.value = '';
                    passwordInput.value = '';
                    fetchBots();
                } else {
                    showToast(result.error || 'Failed to add bot', 'error');
                }
            } catch (error) {
                showToast('Error adding bot: ' + error.message, 'error');
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = 'Add Bot';
            }
        }
        
        async function connectBot(id) {
            try {
                const response = await fetch(`/api/bots/${id}/connect`, { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    showToast('Connection initiated', 'success');
                    if (!isRealtimeConnected) fetchBots();
                } else {
                    showToast(result.error || 'Failed to connect', 'error');
                }
            } catch (error) {
                showToast('Error connecting bot', 'error');
            }
        }
        
        async function disconnectBot(id) {
            try {
                const response = await fetch(`/api/bots/${id}/disconnect`, { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    showToast('Disconnected', 'success');
                    if (!isRealtimeConnected) fetchBots();
                } else {
                    showToast(result.error || 'Failed to disconnect', 'error');
                }
            } catch (error) {
                showToast('Error disconnecting bot', 'error');
            }
        }
        
        async function removeBot(id) {
            if (!confirm('Are you sure you want to remove this bot?')) return;
            
            try {
                const response = await fetch(`/api/bots/${id}`, { method: 'DELETE' });
                const result = await response.json();
                
                if (result.success) {
                    showToast('Bot removed', 'success');
                    if (!isRealtimeConnected) fetchBots();
                } else {
                    showToast(result.error || 'Failed to remove bot', 'error');
                }
            } catch (error) {
                showToast('Error removing bot', 'error');
            }
        }
        
        
        // Authentication functions
        let currentUser = null;
        
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                const result = await response.json();
                
                if (result.success && result.data.isAuthenticated) {
                    currentUser = result.data;
                    showAuthenticatedUI();
                } else {
                    showLoginUI();
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                showLoginUI();
            }
        }
        
        function showAuthenticatedUI() {
            document.getElementById('auth-section').style.display = 'flex';
            document.getElementById('google-login-section').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            
            const userInfo = document.getElementById('user-info');
            if (currentUser) {
                userInfo.textContent = `Signed in as: ${currentUser.name || currentUser.email}`;
            }
        }
        
        function showLoginUI() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('google-login-section').style.display = 'block';
            document.getElementById('main-content').style.display = 'none';
        }
        
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                currentUser = null;
                showToast('Logged out successfully', 'success');
                showLoginUI();
            } catch (error) {
                showToast('Error logging out', 'error');
            }
        }
        
        function handleAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const authStatus = urlParams.get('auth');
            const email = urlParams.get('email');
            
            if (authStatus === 'success') {
                showToast('Successfully signed in!', 'success');
                window.history.replaceState({}, document.title, '/');
                checkAuth();
            } else if (authStatus === 'failed') {
                showToast('Authentication failed', 'error');
                window.history.replaceState({}, document.title, '/');
            } else if (authStatus === 'error') {
                showToast('An error occurred during authentication', 'error');
                window.history.replaceState({}, document.title, '/');
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            initSignalR();
            handleAuthCallback();
            checkServerHealth();
            checkAuth();
            fetchBots();
            
            // Fallback polling if SignalR fails
            setInterval(() => {
                if (!isRealtimeConnected) {
                    fetchBots();
                    checkServerHealth();
                }
            }, 3000);
        });
    </script>
</body>
</html>
